name: checks

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Check types
        run: npm run check:types
      - name: Check formatting
        run: npm run check:formatting
