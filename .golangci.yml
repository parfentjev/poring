version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gosec
    - loggercheck
    - misspell
    - nilerr
    - nolintlint
    - sloglint
    - unconvert
  exclusions:
    generated: strict
    warn-unused: true
